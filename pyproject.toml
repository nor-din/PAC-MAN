[project]
name = "pac-man"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pygame>=2.6.1",
    "pydantic>=2.0.0",
    "flake8-pyproject"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.mypy]
exclude = ["^mazegenerator/"]

[tool.flake8]
exclude = [".git", "__pycache__", "mazegenerator", ".venv"]
